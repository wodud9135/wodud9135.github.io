  <radialGradient id="light" cx=".52" cy=".33" r=".73"><stop stop-color="#fffae5" stop-opacity=".33"/><stop offset="1" stop-color="#0f201b" stop-opacity=".35"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
